<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini Ecommerce</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Mini Ecommerce</h1>
  </header>

  <main>
    <section>
      <input id="search" type="text" placeholder="Buscar produto pelo nome">
      <select id="category"></select>
      <button id="btnRender">Renderizar</button>
    </section>

    <div id="product-list"></div>

    <section>
      <div id="product-details">Clique em "Ver detalhes" em um produto.</div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
